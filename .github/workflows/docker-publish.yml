name: Publicar Entidades en Docker Hub

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Mostrar archivos del proyecto
        run: |
          echo "Archivos en la raíz:"
          ls -la
          echo ""
          echo "Buscando Dockerfile:"
          find . -name Dockerfile -type f

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: vibs98/entidades-app:latest
